[metadata]
name = ocpp-homeassistant
version = 0.0.0

[options]
python_requires = >=3.13

[tool:pytest]
addopts = -qq --cov=custom_components.ocpp --allow-unix-socket --allow-hosts=127.0.0.1
console_output_style = count
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

[coverage:report]
show_missing = true
fail_under = 95
